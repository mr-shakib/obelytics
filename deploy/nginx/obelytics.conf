# Obelytics behind the host nginx -- pairs with docker-compose.prod.yml.
# Installed by deploy/install-nginx.sh as /etc/nginx/sites-available/obelytics.bitstreamhq.com

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name obelytics.bitstreamhq.com;

    ssl_certificate     /etc/letsencrypt/live/obelytics.bitstreamhq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obelytics.bitstreamhq.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Bulk imports, backups/restores, and logo uploads
    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    # FastAPI backend. Other /api/* paths (the /api/auth/* BFF routes) belong to Next.js.
    location ~ ^/(api/v1|health)/ {
        proxy_pass http://127.0.0.1:8320;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3320;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name obelytics.bitstreamhq.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / { return 301 https://$host$request_uri; }
}
