<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page {
    size: letter;
    margin: 0.85in 0.6in 0.75in 0.6in;
    @bottom-center {
      content: "Page " counter(page) " of " counter(pages);
      font-size: 8pt;
      color: #666;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Liberation Serif", "Times New Roman", Georgia, serif;
    font-size: 10pt;
    color: #000;
    line-height: 1.3;
  }
  h1, h2, h3 { margin: 0; }
  .doc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2.25pt solid #9bbb59;
    padding-bottom: 6px;
    margin-bottom: 14px;
  }
  .doc-header .doc-title { font-size: 17pt; font-weight: bold; text-transform: uppercase; }
  .doc-header .doc-org { font-size: 9pt; color: #444; margin-top: 2px; }
  .doc-header .doc-logo img { max-height: 55px; max-width: 200px; }
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px 24px;
    margin-bottom: 16px;
    font-size: 9.5pt;
  }
  .meta-grid .meta-label { color: #555; }
  .meta-grid .meta-value { font-weight: bold; }
  section { margin-bottom: 18px; }
  section > h2 {
    font-size: 12pt;
    border-bottom: 1pt solid #ccc;
    padding-bottom: 3px;
    margin-bottom: 8px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
  th, td { border: 0.75pt solid #bbb; padding: 4px 6px; text-align: left; }
  th { background: #f0f4ea; font-weight: bold; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 8.5pt; font-weight: bold; }
  .badge-ok { background: #dff2e1; color: #1d7254; }
  .badge-bad { background: #fbe1e1; color: #a13a3a; }
  .muted { color: #666; }
  .generated-at { font-size: 8pt; color: #777; margin-top: 24px; }
</style>
</head>
<body>
  <div class="doc-header">
    <div>
      <div class="doc-title">{{ title }}</div>
      {% if org_name %}<div class="doc-org">{{ org_name }}</div>{% endif %}
    </div>
    {% if org_logo_url %}
    <div class="doc-logo"><img src="{{ org_logo_url }}" alt="logo"></div>
    {% endif %}
  </div>

  <div class="meta-grid">
    {% for label, value in meta %}
    <div><span class="meta-label">{{ label }}:</span> <span class="meta-value">{{ value }}</span></div>
    {% endfor %}
  </div>

  {% block content %}{% endblock %}

  <div class="generated-at">Generated {{ generated_at }}</div>
</body>
</html>
